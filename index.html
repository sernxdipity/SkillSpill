    <script>
      // Ensure window.fetch has both a getter and setter so browser extensions and interceptors can wrap it without throwing
      (function() {
        try {
          var _f = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var descriptor = {
            get: function() {
              return _f;
            },
            set: function(val) {
              _f = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
